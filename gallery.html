<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Journal - Photo Gallery</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/gallery.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="main-header">
    <div class="logo">
      <img src="logo1.png" height="35px" width="200px" >
    </div>
    <nav>
      <a href="home.html" class="nav-link">Home</a>
      <a href="gallery.html" class="nav-link active">Gallery</a>
      <a href="diary.html" class="nav-link">Diary</a>
      <a href="travel.html" class="nav-link">Travel Logs</a>
      <button id="logout-btn" class="btn btn-outline">Logout</button>
    </nav>
  </header>

  <main class="container">
    <section class="page-header">
      <h1>Photo Gallery</h1>
      <p>Capture the moment with your travel photos</p>
      <button id="add-photo-btn" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus">
          <path d="M5 12h14"></path>
          <path d="M12 5v14"></path>
        </svg>
        Add New Memories
      </button>
    </section>

    <section id="gallery-grid" class="gallery-grid">
      <!-- Photos will be dynamically added here -->
      <div class="empty-state" id="empty-gallery">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
          <circle cx="9" cy="9" r="2"></circle>
          <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
        </svg>
        <h3>No photos yet</h3>
        <p>Add your first travel memory to get started</p>
      </div>
    </section>
  </main>

  <!-- Add Photo Modal -->
  <div id="photo-modal" class="modal">
    <div class="modal-content">
      <span class="close-button">&times;</span>
      <h2>Add New Photo</h2>
      <form id="photo-form">
        <div class="form-group">
          <label for="photo-file">Select Photo</label>
          <input type="file" id="photo-file" name="photo-file" accept="image/*" required>
          <div id="photo-preview" class="photo-preview"></div>
        </div>
        <div class="form-group">
          <label for="photo-caption">Caption</label>
          <input type="text" id="photo-caption" name="photo-caption" placeholder="Describe this memory...">
        </div>
        <div class="form-group">
          <label for="photo-date">Date</label>
          <input type="date" id="photo-date" name="photo-date" required>
        </div>
        <div class="error-message" id="photo-error"></div>
        <button type="submit" class="btn btn-primary">Save Photo</button>
      </form>
    </div>
  </div>

  <!-- Photo Detail Modal -->
  <div id="photo-detail-modal" class="modal">
    <div class="modal-content photo-detail-content">
      <span class="close-button">&times;</span>
      <div id="detailed-photo-container">
        <img id="detailed-photo" src="" alt="Travel memory">
        <div class="photo-info">
          <p id="detailed-caption" class="photo-caption"></p>
          <p id="detailed-date" class="photo-date"></p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; Wandernest. Your memories, your journey.</p>
  </footer>

  <script src="scripts/auth.js"></script>
  <script src="scripts/storage.js"></script>
  <script src="scripts/gallery.js"></script>
</body>
</html>
